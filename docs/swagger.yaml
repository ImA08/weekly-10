basePath: /
definitions:
  models.AuthForm:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  models.ErrorResponse:
    properties:
      code:
        type: string
      details:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for Tickitz APP
  title: Tickitz
  version: "1.0"
paths:
  /auth:
    post:
      consumes:
      - application/json
      parameters:
      - description: login information
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AuthForm'
      produces:
      - application/json
      responses:
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Login User
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: register information
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AuthForm'
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Register User
swagger: "2.0"
